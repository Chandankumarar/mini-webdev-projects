<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for history icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-inter min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-4xl w-full flex flex-col md:flex-row gap-6 items-start justify-center">
        <!-- Main Calculator UI -->
        <main class="calculator-container w-full md:w-[400px] bg-gray-800 rounded-3xl shadow-2xl overflow-hidden relative border border-gray-700">
            <!-- Header / Display Area -->
            <div class="px-6 pt-8 pb-4 bg-gray-900 border-b border-gray-700 relative group">
                <!-- Expression Display -->
                <div id="expression-display" class="text-right text-gray-400 text-sm h-6 mb-2 overflow-hidden truncate font-mono tracking-wider">
                    <!-- Current expression -->
                </div>
                <!-- Main Result Display -->
                <input type="text" id="result-display" class="w-full bg-transparent text-right text-5xl font-light text-white outline-none placeholder-gray-600 truncate mb-1" value="0" readonly>
            </div>

            <!-- Keypad Area -->
            <div class="p-5 p-grid">
                <div class="grid grid-cols-4 gap-3">
                    <!-- Row 1: Scientific / Utils -->
                    <button class="calc-btn btn-util" data-action="clear-all">AC</button>
                    <button class="calc-btn btn-util" data-action="clear-entry">C</button>
                    <button class="calc-btn btn-operator" data-action="percent">%</button>
                    <button class="calc-btn btn-operator" data-action="divide">÷</button>
                    
                    <!-- Row 2: Scientific -->
                    <button class="calc-btn btn-sci text-sm" data-action="sin">sin</button>
                    <button class="calc-btn btn-sci text-sm" data-action="cos">cos</button>
                    <button class="calc-btn btn-sci text-sm" data-action="tan">tan</button>
                    <button class="calc-btn btn-operator" data-action="multiply">×</button>

                    <!-- Row 3: Scientific -->
                    <button class="calc-btn btn-sci text-sm" data-action="log">log</button>
                    <button class="calc-btn btn-sci text-sm" data-action="ln">ln</button>
                    <button class="calc-btn btn-sci text-sm" data-action="pi">π</button>
                    <button class="calc-btn btn-operator" data-action="subtract">−</button>

                    <!-- Row 4: Scientific / Advanced -->
                    <button class="calc-btn btn-sci text-sm" data-action="square">x²</button>
                    <button class="calc-btn btn-sci text-sm" data-action="power">x^y</button>
                    <button class="calc-btn btn-sci text-sm" data-action="sqrt">√</button>
                    <button class="calc-btn btn-operator" data-action="add">+</button>

                    <!-- Row 5: Brackets & Numbers -->
                    <button class="calc-btn btn-sci" data-action="bracket-left">(</button>
                    <button class="calc-btn btn-sci" data-action="bracket-right">)</button>
                    <button class="calc-btn btn-util" data-action="backspace"><i class="fas fa-backspace"></i></button>
                    <button class="calc-btn btn-equals row-span-4 self-stretch rounded-2xl" id="equals-btn" data-action="calculate">=</button>

                    <!-- Row 6: Numbers -->
                    <button class="calc-btn btn-number" data-value="7">7</button>
                    <button class="calc-btn btn-number" data-value="8">8</button>
                    <button class="calc-btn btn-number" data-value="9">9</button>

                    <!-- Row 7: Numbers -->
                    <button class="calc-btn btn-number" data-value="4">4</button>
                    <button class="calc-btn btn-number" data-value="5">5</button>
                    <button class="calc-btn btn-number" data-value="6">6</button>

                    <!-- Row 8: Numbers -->
                    <button class="calc-btn btn-number" data-value="1">1</button>
                    <button class="calc-btn btn-number" data-value="2">2</button>
                    <button class="calc-btn btn-number" data-value="3">3</button>

                    <!-- Row 9: 0 and Decimal -->
                    <button class="calc-btn btn-number col-span-2 rounded-2xl" data-value="0">0</button>
                    <button class="calc-btn btn-number" data-value=".">.</button>
                </div>
            </div>
            
            <!-- Mobile Toggle History -->
            <button id="toggle-history-btn" class="md:hidden absolute top-4 left-4 text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-history"></i>
            </button>
        </main>

        <!-- History Sidebar -->
        <aside id="history-panel" class="hidden md:flex w-full md:w-[320px] bg-gray-800 rounded-3xl shadow-xl flex-col h-[650px] border border-gray-700 overflow-hidden transition-all duration-300">
            <div class="px-6 py-5 border-b border-gray-700 flex justify-between items-center bg-gray-900/50">
                <h2 class="text-lg font-medium text-gray-200"><i class="fas fa-history mr-2"></i> History</h2>
                <button id="clear-history-btn" class="text-xs text-red-400 hover:text-red-300 transition-colors uppercase font-bold tracking-wider rounded-md px-2 py-1 hover:bg-red-400/10">Clear</button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <!-- History items injected via JS -->
                <div class="flex flex-col items-end opacity-50 text-sm italic">
                    <p>No history yet</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Mobile History Overlay (Hidden initially) -->
    <div id="mobile-history-overlay" class="fixed inset-0 bg-black/80 z-40 hidden md:hidden backdrop-blur-sm transition-opacity opacity-0"></div>
    <div id="mobile-history-panel" class="fixed bottom-0 left-0 right-0 max-h-[70vh] bg-gray-800 rounded-t-3xl z-50 transform translate-y-full transition-transform duration-300 md:hidden flex flex-col">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
            <h2 class="text-lg font-medium"><i class="fas fa-history mr-2"></i> History</h2>
            <button id="close-history-btn" class="p-2 text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <div id="mobile-history-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
